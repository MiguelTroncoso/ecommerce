# ClickAndGo - Evaluacion Sumativa N2 (INACAP TI3V21)
# Certbot agrega el bloque TLS y la redireccion desde HTTP.
server {
    server_name inacap.superflash.site;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    access_log /var/log/nginx/clickandgo.access.log;
    error_log  /var/log/nginx/clickandgo.error.log;

    client_max_body_size 32M;

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen 80;
    listen [::]:80;
}
